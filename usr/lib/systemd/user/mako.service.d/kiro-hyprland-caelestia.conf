# Kiro: Caelestia is the notification server of this edition. mako comes along through kiro-wayland-dotfiles, and its
# D-Bus activation grabs org.freedesktop.Notifications whenever an app notifies before Caelestia is up at login;
# Caelestia then never gets the name. Only refuse mako while Hyprland runs with this edition's config, so the waybar
# editions on the same machine keep mako.
[Service]
ExecCondition=/bin/sh -c '! pgrep -u "$(id -u)" -f "kiro-hyprland-caelestia/hyprland.lua" >/dev/null'
